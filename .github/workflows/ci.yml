name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复推送取消旧跑，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, llmbm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 engines 一致；node:sqlite 需要 24
          node-version: '24'

      - name: Install
        run: npm ci

      # 只校验仓库内精简参考库与 MANIFEST 的 sha256（不读 14MB 原始库，所以 runner 上能跑）
      - name: ModelTrace bank manifest
        run: node scripts/build-modeltrace-bank.mjs --verify-hash

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
