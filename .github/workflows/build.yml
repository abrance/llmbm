name: build

# 发布口径（spec §7）：main 的每次 push **不**发布镜像，只有打 release tag 才发。
# 打 tag（v*）自动构建并推送；workflow_dispatch 保留手动验证（push 输入默认 false）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: '推送到 GHCR（默认只验证构建）'
        type: boolean
        default: false

jobs:
  images:
    runs-on: [self-hosted, linux, x64, llmbm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 刻意不用 docker/setup-buildx-action / login-action / build-push-action：
      # 自托管 runner 每个作业都要从 codeload.github.com 现下这些 action，本机到
      # codeload 只有几十 KB/s 且经常整段卡死（作业卡在 Set up job 十分钟后失败）。
      # 直接调宿主 docker：走 daemon.json 的 registry-mirrors 解析基础镜像，也省掉
      # buildkit 容器不继承镜像源的老问题。
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${GITHUB_REPOSITORY}"
          TAGS=(-t "${IMG}:latest" -t "${IMG}:${GITHUB_SHA}")
          PUSH=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS+=(-t "${IMG}:${GITHUB_REF_NAME}")
            PUSH=true
          fi
          if [[ "${{ inputs.push }}" == "true" ]]; then PUSH=true; fi

          docker build -f deploy/Dockerfile "${TAGS[@]}" .

          if [[ "${PUSH}" == "true" ]]; then
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker push "${IMG}:${GITHUB_SHA}"
            docker push "${IMG}:latest"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then docker push "${IMG}:${GITHUB_REF_NAME}"; fi
            docker logout ghcr.io || true
          fi
