name: build

# v0.1 只在本机验收，镜像构建不随 main 推送自动跑（spec §7）。
# 等 v0.1 验收通过、上 cops 云环境（cloud3 k3s）时再恢复 push 触发。
on:
  workflow_dispatch:
    inputs:
      push:
        description: '推送到 GHCR（默认只验证构建）'
        type: boolean
        default: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发默认不推送，只验证镜像能构建；需要推时勾 push 输入
      # 单镜像：api 进程内托管前端产物（spec §7）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
