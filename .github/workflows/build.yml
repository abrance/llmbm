name: build

# 发布口径（spec §7）：main 的每次 push **不**发布镜像，只有打 release tag 才发。
# 打 tag（v*）自动构建并推送；workflow_dispatch 保留手动验证（push 输入默认 false）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: '推送到 GHCR（默认只验证构建）'
        type: boolean
        default: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 推送 = 发布（tag 名即镜像 tag，另打 latest）；手动触发默认不推送
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ inputs.push || github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
