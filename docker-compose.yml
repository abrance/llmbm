services:
  llmbm:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ghcr.io/abrance/llmbm:local
    restart: unless-stopped
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      LLMBM_DB: /data/llmbm.db
    volumes:
      - llmbm-data:/data
    ports:
      - '8080:8787'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  llmbm-data:
